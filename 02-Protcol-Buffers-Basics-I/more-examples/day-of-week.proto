syntax = "proto3";

/*
Question:
Create a proto3 Enum for DayOfWeek (example: Monday),
and keep 0 as "undefined" day.
Also include it inside a message.
*/

message DayOfWeekMessage {

  enum DayOfWeek {
    DAY_OF_WEEK_UNDEFINED = 0;

    MONDAY = 1;
    TUESDAY = 2;
    WEDNESDAY = 3;
    THURSDAY = 4;
    FRIDAY = 5;
    SATURDAY = 6;
    SUNDAY = 7;
  }

  DayOfWeek day = 1;
}